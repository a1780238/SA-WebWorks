name: deploy-production

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python compiles
        run: python3 -m py_compile src/sa_webworks_service.py

      - name: Deploy placeholder
        run: |
          echo "Deploy to Hostinger via SSH/rsync in production."
          echo "Bind this to secrets: HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_KEY"
