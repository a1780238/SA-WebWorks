<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SA WebWorks Lead Console</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 0; background: #0b1020; color: #edf2ff; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: #161d34; border: 1px solid #2a3357; border-radius: 12px; padding: 16px; }
    h1,h2 { margin: 0 0 12px; }
    label { display:block; margin:10px 0 6px; font-size: 13px; color:#b8c2ea; }
    input, select, textarea, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3a4674; background: #10172d; color: #edf2ff; }
    button { background: #2f68ff; cursor: pointer; border: none; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #2a3357; text-align: left; padding: 8px 4px; }
    .kpis { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin-bottom: 14px; }
    .kpi { background:#10172d; border:1px solid #2a3357; border-radius:10px; padding:10px; }
    .muted { color:#98a7da; font-size:12px; }
    @media (max-width: 900px){ .grid{grid-template-columns:1fr;} .kpis{grid-template-columns:1fr 1fr;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SA WebWorks — Lead Automation Console</h1>
    <p class="muted">Tailor-made UI for SA tradie lead capture, qualification, and revenue visibility.</p>

    <div class="kpis">
      <div class="kpi"><div class="muted">Total Leads</div><div id="kTotal">0</div></div>
      <div class="kpi"><div class="muted">Projected Revenue (AUD)</div><div id="kRevenue">0</div></div>
      <div class="kpi"><div class="muted">Hot Leads</div><div id="kHot">0</div></div>
      <div class="kpi"><div class="muted">Avg Entropy</div><div id="kEntropy">0</div></div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>New Lead</h2>
        <form id="leadForm">
          <label>Name</label><input name="name" required />
          <label>Email</label><input name="email" type="email" required />
          <label>Phone</label><input name="phone" />
          <label>Suburb</label><input name="suburb" placeholder="e.g. Morphett Vale" />
          <label>Service Type</label>
          <select name="service_type" required>
            <option value="lead_automation">Lead Automation</option>
            <option value="website_rebuild">Website Rebuild</option>
            <option value="seo_growth">SEO Growth</option>
            <option value="blocked_drain">Blocked Drain</option>
            <option value="hot_water">Hot Water</option>
          </select>
          <label>Urgency</label>
          <select name="urgency">
            <option value="this_month">This Month</option>
            <option value="this_week">This Week</option>
            <option value="asap">ASAP</option>
            <option value="emergency">Emergency</option>
          </select>
          <label>Budget (AUD)</label><input name="budget_aud" type="number" min="0" />
          <label>Notes</label><textarea name="notes" rows="3"></textarea>
          <button type="submit">Capture & Qualify</button>
        </form>
        <p id="result" class="muted"></p>
      </section>

      <section class="card">
        <h2>Recent Leads</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Suburb</th><th>Band</th><th>Status</th><th>Revenue</th></tr>
          </thead>
          <tbody id="leadRows"></tbody>
        </table>
      </section>
    </div>
  </div>

<script>
async function refresh() {
  const rev = await fetch('/api/revenue-summary').then(r=>r.json());
  document.getElementById('kTotal').textContent = rev.total_leads ?? 0;
  document.getElementById('kRevenue').textContent = rev.projected_revenue_aud ?? 0;
  document.getElementById('kHot').textContent = rev.hot_leads ?? 0;
  document.getElementById('kEntropy').textContent = rev.avg_entropy_score ?? 0;

  const leads = await fetch('/api/leads').then(r=>r.json());
  const tbody = document.getElementById('leadRows');
  tbody.innerHTML = '';
  for (const l of (leads.leads || []).slice(0, 12)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${l.name||''}</td><td>${l.suburb||''}</td><td>${l.score_band||''}</td><td>${l.status||''}</td><td>${l.estimated_revenue_aud||0}</td>`;
    tbody.appendChild(tr);
  }
}

document.getElementById('leadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  if (payload.budget_aud) payload.budget_aud = Number(payload.budget_aud);

  const r = await fetch('/api/leads', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await r.json();
  document.getElementById('result').textContent = r.ok
    ? `Lead ${data.lead_id} | ${data.score_band.toUpperCase()} | Est Revenue $${data.estimated_revenue_aud}`
    : `Error: ${data.error}`;
  if (r.ok) { e.target.reset(); await refresh(); }
});

refresh();
</script>
</body>
</html>
